########## Bed Fans #########

[heater_generic chamber]
heater_pin: PD13
max_power: 0.8
sensor_type: Generic 3950
sensor_pin: PF6
control: pid
pid_Kp: 61.470837
pid_Ki: 0.5
pid_Kd: 0
pwm_cycle_time: 0.05
min_temp: -273.15
max_temp: 75

[verify_heater chamber]
max_error: 120
check_gain_time: 120
hysteresis: 50
heating_gain: 1

[gcode_macro SET_CHAMBER_TEMPERATURE]
variable_original_target: 0
gcode:
    {% set target = params.TARGET|default(0)|int %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={target}
    SET_GCODE_VARIABLE MACRO=SET_CHAMBER_TEMPERATURE VARIABLE=original_target VALUE={target}
    UPDATE_DELAYED_GCODE ID=UPDATE_CHAMBER_TARGET DURATION=10

[goce_macro TURN_OFF_HEATERS]
rename_existing: __TURN_OFF_HEATERS
gcode:
    __TURN_OFF_HEATERS
    UPDATE_DELAYED_GCODE ID=UPDATE_CHAMBER_TARGET DURATION=0
    SET_GCODE_VARIABLE MACRO=SET_CHAMBER_TEMPERATURE VARIABLE=original_target VALUE=0

[delayed_gcode UPDATE_CHAMBER_TARGET]
gcode:
    {% set current_sensor_temp = printer['heater_generic chamber'].temperature %}
    {% set current_nevermore_temp = printer.nevermore.intake_temperature %}
    {% set delta = current_nevermore_temp - current_sensor_temp | max(0) %}
    {% set current_target = printer['heater_generic chamber'].target %}
    {% set original_target = printer['gcode_macro SET_CHAMBER_TEMPERATURE'].original_target %}
    {% if current_target > 10 and original_target > 10 %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={((original_target + delta) | min(60)) - delta}
        UPDATE_DELAYED_GCODE ID=UPDATE_CHAMBER_TARGET DURATION=10
    {% endif %}
